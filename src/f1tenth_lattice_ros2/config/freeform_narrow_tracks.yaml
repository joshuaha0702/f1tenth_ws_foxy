# freeform_tracks.yaml의 트랙을 폭 1.6~2.6 m로 좁힌 변형 (Freeform_fNN -> Freeform_nNN). 중앙선은 원본과 같다:
# shape_width(원본 폭)로 원본과 같은 시드열에서 모양을 찾은 뒤 벽만 ±width/2에 세운다.
# 폭은 번호 순으로 2.6/1.6/1.8/2.0/2.2/2.4 m를 돌아가며 배정 (n04 = 2.0 m, 평가 기준 맵).
# 플래너는 raceline1만 추종하므로 벽 여유(>= 0.6 m) 검사는 raceline1에만 적용한다. 생성:
#   python3 src/f1tenth_lattice_ros2/tools/generate_freeform_tracks.py \
#       --config src/f1tenth_lattice_ros2/config/freeform_narrow_tracks.yaml --overview Freeform_narrow_overview.png
clearance_lanes: [1]

tracks:
  - { name: Freeform_n01, width: 2.6, shape_width: 3.4, kappa_min: 0.25, kappa_max: 0.40, n_corners: 5, left_share: 0.15, straight: [3.0, 10.0], seed: 101 }
  - { name: Freeform_n02, width: 1.6, shape_width: 3.2, kappa_min: 0.30, kappa_max: 0.45, n_corners: 6, left_share: 0.25, straight: [2.0, 8.0], seed: 102 }
