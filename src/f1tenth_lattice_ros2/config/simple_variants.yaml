# Simple 트랙 수치 증강 변형 목록. tools/generate_simple_variants.py가 읽어서
# maps/<name>/, racecar_description/meshes/<name 소문자>.stl, worlds/<name 소문자>.world를 생성한다.
#
# track_width:     명목 트랙 폭 (m). 원본 Simple 약 3.2 m
# straight_length: 두 코너 중심 사이 직선 길이 (m). 원본 Simple 약 16 m
# wall_amplitude:  벽 굴곡의 최대 변위 (m). 안쪽/바깥쪽 벽이 독립적으로 흔들려 국소 폭이 달라진다. 0이면 매끈한 벽
# min_wavelength:  굴곡의 최소 파장 (m). 파장 상한은 12 m
# seed:            굴곡 난수 시드
#
# 생성기는 국소 폭 >= 2.8 m, 레이스 라인 벽 여유 >= 0.6 m를 만족하지 않으면 실패한다.

defaults:
  min_wavelength: 4.0

variants:
  - { name: Simple_v01, track_width: 3.2, straight_length: 16.0, wall_amplitude: 0.00, seed: 1 }
