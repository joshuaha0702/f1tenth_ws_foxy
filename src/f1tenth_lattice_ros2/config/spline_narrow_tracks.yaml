# spline_tracks.yaml의 트랙을 폭 1.6~2.6 m로 좁힌 변형 (Spline_sNN -> Spline_nNN). 중앙선은 원본과 같다:
# shape_width(원본 폭)로 원본과 같은 시드열에서 모양을 찾은 뒤 벽만 ±width/2에 세운다.
# 폭은 번호 순으로 2.6/1.6/1.8/2.0/2.2/2.4 m를 돌아가며 배정 (n04 = 2.0 m, 평가 기준 맵).
# 플래너는 raceline1만 추종하므로 벽 여유(>= 0.6 m) 검사는 raceline1에만 적용한다. 생성:
#   python3 src/f1tenth_lattice_ros2/tools/generate_freeform_tracks.py \
#       --config src/f1tenth_lattice_ros2/config/spline_narrow_tracks.yaml --overview Spline_narrow_overview.png
clearance_lanes: [1]

defaults: { mode: spline }

tracks:
  - { name: Spline_n01, width: 2.6, shape_width: 3.6, kappa_max: 0.40, n_ctrl: 8,  straight_share: 0.4, left_share: 0.0,  kappa_spread: 0.2, seed: 201 }
  - { name: Spline_n02, width: 1.6, shape_width: 3.4, kappa_max: 0.44, n_ctrl: 10, straight_share: 0.3, left_share: 0.1,  kappa_spread: 0.3, seed: 202 }
  - { name: Spline_n03, width: 1.8, shape_width: 3.2, kappa_max: 0.47, n_ctrl: 12, straight_share: 0.4, left_share: 0.2,  kappa_spread: 0.3, seed: 203 }
  - { name: Spline_n04, width: 2.0, shape_width: 3.0, kappa_max: 0.50, n_ctrl: 8,  straight_share: 0.3, left_share: 0.0,  kappa_spread: 0.2, seed: 204 }
  - { name: Spline_n05, width: 2.2, shape_width: 3.0, kappa_max: 0.52, n_ctrl: 12, straight_share: 0.2, left_share: 0.2,  kappa_spread: 0.4, seed: 205 }
  - { name: Spline_n06, width: 2.4, shape_width: 2.8, kappa_max: 0.56, n_ctrl: 10, straight_share: 0.1, left_share: 0.2,  kappa_spread: 0.2, seed: 206 }
  - { name: Spline_n07, width: 2.6, shape_width: 2.8, kappa_max: 0.57, n_ctrl: 14, straight_share: 0.2, left_share: 0.3,  kappa_spread: 0.1, seed: 207 }
  - { name: Spline_n08, width: 1.6, shape_width: 2.8, kappa_max: 0.55, n_ctrl: 16, straight_share: 0.3, left_share: 0.2,  kappa_spread: 0.3, seed: 208 }
  - { name: Spline_n09, width: 1.8, shape_width: 3.2, kappa_max: 0.45, n_ctrl: 14, straight_share: 0.3, left_share: 0.2,  kappa_spread: 0.3, seed: 209 }
  - { name: Spline_n10, width: 2.0, shape_width: 3.0, kappa_max: 0.53, n_ctrl: 9,  straight_share: 0.5, left_share: 0.0,  kappa_spread: 0.2, seed: 210 }
  - { name: Spline_n11, width: 2.2, shape_width: 2.8, kappa_max: 0.56, n_ctrl: 10, straight_share: 0.1, left_share: 0.3,  kappa_spread: 0.2, seed: 211 }
  - { name: Spline_n12, width: 2.4, shape_width: 3.4, kappa_max: 0.42, n_ctrl: 16, straight_share: 0.3, left_share: 0.1,  kappa_spread: 0.3, seed: 212 }
