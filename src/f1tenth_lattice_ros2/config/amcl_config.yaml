amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: scan
    map_topic: /map
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    
    # Particle filter settings
    min_particles: 500
    max_particles: 2000
    
    # Initial pose (초기 위치 리셋 활성화)
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    initial_cov_xx: 0.25
    initial_cov_yy: 0.25
    initial_cov_aa: 0.068
    
    # Motion model parameters
    odom_model_type: diff-corrected
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    odom_alpha5: 0.1
    
    # Laser model parameters
    laser_model_type: likelihood_field
    laser_z_hit: 0.95
    laser_z_short: 0.1
    laser_z_max: 0.05
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    
    # Resampling
    resample_interval: 1
    selective_resampling: false
    
    # Update thresholds
    update_min_d: 0.1
    update_min_a: 0.2
    
    transform_tolerance: 1.0
    tf_broadcast: true
    pf_err: 0.05
    pf_z: 0.99