# 곡률이 연속적으로 변하는 트랙 목록 (mode: spline). tools/generate_freeform_tracks.py가 읽어서
# maps/<name>/, racecar_description/meshes/<name 소문자>.stl, worlds/<name 소문자>.world를 생성한다.
#
#   python3 src/f1tenth_lattice_ros2/tools/generate_freeform_tracks.py --config src/f1tenth_lattice_ros2/config/spline_tracks.yaml
#
# Freeform_f*(일정 곡률 코너 + 직선)와 Simple_v*(타원)는 곡률이 코너 경계에서 계단처럼 바뀐다.
# 원본 Simple은 raceline 곡률이 랩 전체에서 연속적으로 변한다
# (max |k| 0.53, |k|>0.4 22 %, mean |dk/ds| 0.064, max |dk/ds| 0.28 1/m^2).
#
# 중앙선 곡률 k(s) = 호 길이에 대한 주기 3차 스플라인 (제어점 n_ctrl개, 거의 균등 간격 + 지터).
# 제어점 종류: 직선(|k| ~ 0, 비율 straight_share) / 좌회전(S자, 나머지 중 left_share, 피크의 20~70 %) /
#              우회전 코너(피크 x [1 - kappa_spread, 1]).
# 총 회전 -360도로 랩 길이를 정하고, 한 주기 cos/sin 보정으로 루프를 닫은 뒤 피크 |k| = kappa_max가
# 되도록 전체 크기를 조정한다. 시계 방향. kappa_max <= 1/(width/2 + 0.3)
# width: 트랙 폭 (m), seed: 난수 시드 (조건을 만족할 때까지 같은 시드 열에서 재시도)

defaults: { mode: spline }

