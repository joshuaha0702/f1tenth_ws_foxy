# === 실차(SLAM/AMCL) 전용 설정 ===
# f1tenth_lattice_real.launch.py 의 기본 config. 실차 안정성 기준으로 튜닝돼 있다
# (상대차 회피 가중치 0.0, lh_grid 축소, lookahead 확대, 조향 보강 ON).
# 시뮬레이션 데이터 수집에는 쓰지 말 것 — 시뮬 기본 config는 sim_lattice_config.yaml 이며
# f1tenth_lattice_gazebo.launch.py 가 그 파일을 기본으로 읽는다.

# === Global defaults ===
get_follow_optim_cost: true
get_map_collision: true
get_similarity_cost: true
weights_num: 4
ittc_thres: 3.0
scan_num: 144

params_num:
  - 1
  - 4
params_name:
  - traj_v_scale
  - cost_weights

tracker_steps: 10
vel_scale: 1.0

minL: 0.8
maxL: 2.0
Lscale: 4.0
minP: 0.4
maxP: 0.7
Pscale: 8.0
D: 0.1
interpScale: 10

# 실차 추종 보강 (pure_pursuit.py, opt-in; 생략 시 모두 꺼짐 = 시뮬 수집 당시 동작)
adaptive_lookahead: true        # 조향각에 따라 lookahead 단축 (코너 탈출 개선)
adaptive_lookahead_gain: 1.8    # steer_factor = 1 / (1 + gain*|steer|)
adaptive_lookahead_min: 0.65    # 단축 하한 [m]
k_heading: 0.25                 # heading error 보정 게인 (코너 탈출 시 조기 복원 방지)

wpt_xind: 0
wpt_yind: 1
wpt_vind: 2

# === Ego vehicle (실차 안정성 강화) ===
car1:
  lh_grid_lb: -0.3
  lh_grid_ub: 0.5
  traj_points: 12
  traj_v_scale: 1.0
  traj_v_span_min: 0.1
  traj_v_span_max: 1.0
  traj_v_span_num: 19

  spawn:
    x: 6.4
    y: 16.0
    yaw_deg: -90.0

  # [Follow, Map Collision, Curvature Penalty, Opponent]
  cost_weights:
    - 0.4
    - 0.5
    - 0.05
    - 0.0
  minL: 0.8
  maxL: 2.0
  Lscale: 4.0
  minP: 0.4
  maxP: 0.7

  # === 선두 차량 추종(following) 모드 ===
  follow:
    zones:
      - { min: 90,  max: 140 }
      - { min: 210, max: 235 }
      - { min: 0, max: 15 }
    lateral_align_m: 3.0
    desired_gap_m: 1.5
    kp_gap: 0.8
    max_follow_speed: 2.0     # 실차 테스트 시 서행 유도
    horizon_m: 3.0


# === Opponent vehicle ===
car2:
  lh_grid_lb: -0.5
  lh_grid_ub: 0.5
  traj_points: 10
  traj_v_scale: 0.5
  traj_v_span_min: 0.1
  traj_v_span_max: 1.0
  traj_v_span_num: 19

  spawn:
    x: 6.4
    y: 12.0
    yaw_deg: -90.0
  cost_weights:
    - 0.10
    - 10.0
    - 0.003
    - 0.0
  minL: 0.2
  maxL: 1.8
  Lscale: 8.0
  minP: 0.5
  maxP: 0.8

lh_grid_lb: -0.6
lh_grid_ub: 0.6

# [수정] 전방 주시 거리(Lookahead)를 1.0m -> 1.6m로 확장
# 실차 서보/VESC 반응 지연을 커버하여 직선 주행 시 뱀처럼 흔들리는 현상 제거
lookahead_distance: 1.6
wheelbase: 0.33
