# === 실차(SLAM/AMCL) 전용 설정 ===
# f1tenth_lattice_real.launch.py 의 기본 config. 실차 안정성 기준으로 튜닝돼 있다
# (상대차 회피 가중치 0.0, lh_grid 축소, lookahead 확대, 조향 보강 ON).
# 시뮬레이션 데이터 수집에는 쓰지 말 것 — 시뮬 기본 config는 sim_lattice_config.yaml 이며
# f1tenth_lattice_gazebo.launch.py 가 그 파일을 기본으로 읽는다.

# === Global defaults ===
get_follow_optim_cost: true
get_map_collision: true
get_similarity_cost: true
weights_num: 4
ittc_thres: 3.0
scan_num: 144

params_num:
  - 1
  - 4
params_name:
  - traj_v_scale
  - cost_weights

tracker_steps: 10
vel_scale: 1.0

minL: 0.8
maxL: 2.0
Lscale: 4.0
minP: 0.4
maxP: 0.7
Pscale: 8.0
D: 0.02
interpScale: 10

# 실차 추종 보강 (pure_pursuit.py, opt-in; 생략 시 모두 꺼짐 = 시뮬 수집 당시 동작)
adaptive_lookahead: true        # 조향각에 따라 lookahead 단축 (코너 탈출 개선)
adaptive_lookahead_gain: 1.8    # steer_factor = 1 / (1 + gain*|steer|)
adaptive_lookahead_min: 0.65    # 단축 하한 [m] (코너 에이펙스 타이트하게 물기 복원)
k_heading: 0.10                 # heading error 보정 게인 (0.10으로 밸런스 유지 - 조기 복원 방지 및 헌팅 차단)

wpt_xind: 0
wpt_yind: 1
wpt_vind: 2

# === Ego vehicle (실차 안정성 및 좁은 트랙 회피 최적화) ===
car1:
  lh_grid_lb: -0.6
  lh_grid_ub: 0.6
  traj_points: 12
  traj_v_scale: 1.0
  traj_v_span_min: 0.7
  traj_v_span_max: 1.0
  traj_v_span_num: 7

  # 좁은 트랙(1.2~1.5m) 횡방향 샘플링 설정 (10cm 간격)
  sampling_width_max: 0.6
  sampling_width_num: 13
  collision_thres: 0.26
  curve_v_penalty_gain: 2.2

  spawn:
    x: 6.4
    y: 16.0
    yaw_deg: -90.0

  # [Follow, Map Collision, Curvature Penalty, Opponent]
  cost_weights:
    - 0.4
    - 1.5
    - 0.2
    - 35.0
  minL: 0.8
  maxL: 2.0
  Lscale: 4.0
  minP: 0.4
  maxP: 0.7

  # === 선두 차량 추종(following) 모드 ===
  follow:
    zones: []
    lateral_align_m: 3.0
    desired_gap_m: 1.2        # 안전 유지 거리 [m]
    kp_gap: 0.8
    max_follow_speed: 1.0     # 추월 불가 시 안전 서행 속도 [m/s]
    horizon_m: 3.0


# === Opponent vehicle ===
car2:
  lh_grid_lb: -0.5
  lh_grid_ub: 0.5
  traj_points: 10
  traj_v_scale: 0.5
  traj_v_span_min: 0.1
  traj_v_span_max: 1.0
  traj_v_span_num: 19

  spawn:
    x: 6.4
    y: 12.0
    yaw_deg: -90.0
  cost_weights:
    - 0.10
    - 10.0
    - 0.003
    - 0.0
  minL: 0.2
  maxL: 1.8
  Lscale: 8.0
  minP: 0.5
  maxP: 0.8

lh_grid_lb: -0.6
lh_grid_ub: 0.6
collision_thres: 0.26
curve_v_penalty_gain: 2.2

# [수정] 전방 주시 거리(Lookahead)를 1.2m로 조정
# 회피 궤적 추종 반응성을 확보하면서도 진동/흔들림 방지
lookahead_distance: 1.2
wheelbase: 0.325
