# 비타원형(free-form) 트랙 목록. tools/generate_freeform_tracks.py가 읽어서
# maps/<name>/, racecar_description/meshes/<name 소문자>.stl, worlds/<name 소문자>.world를 생성한다.
#
# Simple_v01~v20(타원, raceline 곡률 <= 0.38)에 없는 급커브·S자·헤어핀을 학습에 넣기 위한 맵.
# 원본 Simple은 raceline 곡률 최대 0.53, 0.4 초과 22%.
#
# width:          트랙 폭 (m). 중앙선(raceline1) 양쪽 width/2에 벽
# 중앙선 = 일정 곡률 코너(회전각 무작위: 우 40~100도 / 120~190도 헤어핀, 좌 30~120도 = S자) +
#          코너 사이 직선(루프가 닫히도록 길이를 최적화로 결정). 시계 방향.
# kappa_min/max:  코너 곡률 범위 (1/m). 가장 큰 회전에 kappa_max. kappa_max <= 1/(width/2 + 0.3)
# n_corners:      코너 수
# left_share:     좌회전 코너 비율 (S자 빈도)
# straight:       직선 길이 범위 [최소, 목표 최대] (m)
# seed:           난수 시드 (조건을 만족할 때까지 같은 시드 열에서 재시도)
#
# 평가 전용(학습 제외) 후보: Freeform_f04, Freeform_f10, Freeform_f16

